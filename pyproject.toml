[project]
name = "samaya"
version = "0.1.0"
description = "连接常驻 Codex app-server 的单用户网页工作台"
authors = [
    {name = "migo",email = "1695587905@qq.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai-codex (==0.160.0)",
    "fastapi[standard] (==0.142.2)",
    "typer (==0.27.2)",
    "websockets (==15.0.1)",
    "python-dotenv (==1.2.4)",
    "jsonschema[format-nongpl] (==4.26.0)"
]

[tool.poetry]
packages = [{include = "samaya", from = "src"}]

[tool.poetry.scripts]
samaya = "samaya.commands.app:app"

[tool.poetry.dependencies]
openai-codex = {source = "PyPI"}
fastapi = {source = "PyPI"}
typer = {source = "PyPI"}
websockets = {source = "PyPI"}
python-dotenv = {source = "PyPI"}
jsonschema = {source = "PyPI"}

[tool.poetry.group.dev.dependencies]
pytest = {source = "PyPI"}
pytest-asyncio = {source = "PyPI"}
httpx = {source = "PyPI"}
ruff = {source = "PyPI"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest (==8.4.2)",
    "pytest-asyncio (==0.26.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.10,<0.17.0)"
]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"


[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
